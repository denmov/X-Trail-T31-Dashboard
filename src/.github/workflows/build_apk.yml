name: Build X-Trail T31 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Flutter Android Project & Inject Code
        run: |
          flutter create --org com.nissan.t31 --project-name xtrail_t31_monitor app_build
          cp src/main.dart app_build/lib/main.dart
          cd app_build

          # Добавляем библиотеки Bluetooth
          flutter pub add flutter_bluetooth_serial permission_handler

          # Прописываем разрешения Bluetooth в AndroidManifest.xml (для Android 6 - 14)
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.BLUETOOTH" />\n\
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n\
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n\
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

          # Патч совместимости namespace для плагина flutter_bluetooth_serial на новом Gradle
          PUB_CACHE_DIR="$HOME/.pub-cache/hosted/pub.dev"
          BT_BUILD_GRADLE=$(find "$PUB_CACHE_DIR" -path "*flutter_bluetooth_serial*/android/build.gradle" | head -n 1)
          if [ -n "$BT_BUILD_GRADLE" ]; then
            sed -i '/android {/a \    namespace "io.github.edufolly.flutterbluetoothserial"' "$BT_BUILD_GRADLE"
          fi

      - name: Build Release APK
        working-directory: ./app_build
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: XTrail-T31-Monitor-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
